<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>홍보영상 프롬프트 메이커</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand"><span class="logo">▶</span> 홍보영상 프롬프트 메이커 <span class="ver">v2</span></div>
  </header>

  <main>
    <form id="form" class="panel">
      <h2>키워드 입력</h2>
      <label>상품 키워드 <span class="req">*</span>
        <input id="product" placeholder="예: 겨울 코트" maxlength="60" required />
      </label>
      <label>샵 이름 <span class="req">*</span>
        <input id="shop" placeholder="예: 상아 샵" maxlength="40" required />
      </label>

      <div class="row">
        <label>영상 길이
          <select id="length"></select>
        </label>
        <label>화면 비율
          <select id="ratio"></select>
        </label>
      </div>

      <label>대상 영상 AI
        <select id="tool"></select>
      </label>

      <div class="block">
        <div class="block-head">
          <span>참고 이미지 <small>(선택 · 자동 누끼)</small></span>
          <button id="addImageBtn" type="button" class="mini">+ 추가</button>
        </div>
        <div id="images" class="images"></div>
        <p id="imageHint" class="hint">상품·모델 사진을 넣으면 배경을 지우고, 그 모습 그대로 모든 컷에 유지되도록 프롬프트에 반영해요.</p>
      </div>

      <details>
        <summary>세부 옵션 (선택)</summary>
        <label>분위기 / 톤
          <input id="tone" maxlength="120" placeholder="예: 고급스럽고 따뜻한, 미니멀" />
        </label>
        <label>추가 요청사항
          <textarea id="notes" rows="3" maxlength="500" placeholder="예: 30대 여성 타깃, 캐시미어 소재 강조, 연말 세일 20%"></textarea>
        </label>
      </details>

      <button id="genBtn" type="submit" class="primary">✨ 영상 프롬프트 만들기</button>
      <button id="cancelBtn" type="button" class="ghost hidden">취소</button>
      <p id="formWarn" class="warn hidden"></p>
    </form>

    <section id="output" class="panel output">
      <div id="empty" class="empty">
        <div class="big">🎬</div>
        <p>상품 키워드와 샵 이름만 입력하면<br />씬별 키프레임·영상 프롬프트, 자막, 내레이션, SNS 문구까지 만들어 드려요.</p>
      </div>
      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p id="loadingText">크리에이티브 디렉터가 콘셉트를 구상하고 있어요…</p>
      </div>
      <div id="error" class="error hidden"></div>
      <div id="result" class="hidden"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
